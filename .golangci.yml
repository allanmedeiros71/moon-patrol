version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
